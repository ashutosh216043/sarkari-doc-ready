      content="Resize, crop, and validate Indian government exam photos, signatures, thumb impressions, and declarations to exact KB and pixel rules 100% privately in your browser."

      property="og:title"

      content="Resize, crop, and validate Indian government exam photos, signatures, and declarations to exact KB limits 100% privately in your browser."
    />
    <meta property="og:site_name" content="SarkariDocReady" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SarkariDocReady – SSC, IBPS, UPSC &amp; RRB Photo &amp; Signature Resizer"

      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "#sarkaridocready-app",
            "name": "SarkariDocReady",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "All",
            "description": "100% client-side Indian Government Exam Photo, Signature, Thumb Impression, and Handwritten Declaration Auto-Validator & Resizer for SSC, IBPS, SBI, UPSC, and RRB.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "INR"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do I resize a photo and signature for SSC CGL, CHSL, and GD?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Select the SSC preset in SarkariDocReady. Upload your photograph and signature, pan and zoom inside the 3.5cm x 4.5cm (350x450px) and 4.0cm x 2.0cm (400x200px) frames, and our browser engine automatically compresses the JPEG to 20KB-50KB for photo and 10KB-20KB for signature."
                }
              },
              {
                "@type": "Question",
                "name": "What are the IBPS and SBI photo, signature, thumb impression, and declaration sizes?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "IBPS and SBI forms require a 200x230px photo (20KB-50KB), 140x60px black-ink signature (10KB-20KB), 240x240px left thumb impression (20KB-50KB), and 800x400px handwritten declaration (50KB-100KB), all in JPG format."
                }
              },
              {
                "@type": "Question",
                "name": "How do I add Name and Date of Photo (DOP) for UPSC or SSC?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Enable the 'Add Candidate Name & Date Stamp' switch under the Photo Editor, enter your name and date of photo, and SarkariDocReady draws a crisp white strip with bold black text at the bottom edge while staying within the exact KB and pixel limits."
                }
              },
              {
                "@type": "Question",
                "name": "Are my personal photos uploaded to any server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. All cropping, background whitening, text stamping, JPEG compression, and ZIP packaging run 100% locally in your browser via HTML5 Canvas and JavaScript. Your photos never leave your device."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">

  </body>
